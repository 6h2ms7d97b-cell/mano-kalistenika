<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mano kalistenika</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f7f7;background:#171a20}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:#252a32;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:4px 0}small,.muted{color:#aeb5c0}main{padding:16px;max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.pill,button,select,input,textarea{font:inherit}button{border:0;cursor:pointer}.pill{border-radius:22px;background:#353b45;color:white;padding:12px}.green{background:#a0ffad;color:#141b19;font-weight:800;border-radius:14px;padding:15px}.work{background:#292e37;border-radius:14px;margin:12px 0;overflow:hidden}.workhead{padding:18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.details{padding:0 14px 14px}.exercise{background:#363b45;border-radius:12px;margin:10px 0;padding:14px}.exhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.exhead b{font-size:16px}.exhead small{display:block;margin-top:5px}.fields{display:grid;grid-template-columns:1fr 1fr 1fr 44px;gap:6px;margin-top:10px}.fields input{width:100%;min-width:0;background:#20242c;color:white;border:1px solid #535963;border-radius:8px;padding:10px 4px;text-align:center}.fields button{border-radius:8px;background:#505866;color:white}.fields button.done{background:#a0ffad;color:#152017}.notes{width:100%;margin-top:10px;padding:10px;border-radius:8px;background:#20242c;color:white;border:1px solid #535963;resize:vertical}.mini{background:#4a515c;color:white;border-radius:8px;padding:9px;margin-top:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}.stats{font-size:12px;color:#bfc5cc;margin-top:6px}footer{padding:24px;text-align:center;color:#9ca4ae;font-size:12px}</style><header><div class="top"><div><small>ASMENINĖ SPORTO PROGRAMĖLĖ</small><h1>Mano kalistenika</h1></div><span>4× / sav.</span></div><div class="row"><label for="week">Savaitė</label><select id="week" class="pill"></select><button class="pill" id="export">Eksportuoti duomenis</button></div></header><main><div id="app"></div></main><footer>Duomenys saugomi šioje naršyklėje. Išsisaugok atsarginę kopiją.</footer><script>
const workouts=[{name:'PUSH / LEGS 1',duration:56,ex:[['Handstand to L-sit',4,1,3,'reps'],['Straddle planche',4,1,3,'secs'],['Handstand push up',4,1,5,'reps'],['Assisted planche push up',3,2,4,'reps'],['Pseudo push up',3,6,12,'reps'],['Box jumps',3,8,16,'reps'],['Bulgarian split squat (left)',3,10,20,'reps'],['Bulgarian split squat (right)',3,10,20,'reps']]},{name:'PULL / CORE 1',duration:64,ex:[['Straddle frontlever',4,1,10,'secs'],['Assisted straddle backlever',4,5,15,'secs'],['Muscle up',4,2,8,'reps'],['Weighted pull up',4,4,8,'reps'],['Single leg frontlever raise',4,2,5,'reps'],['Single leg dragon flag',4,4,8,'reps'],['Core compressions',3,8,16,'reps']]},{name:'PUSH / LEGS 2',duration:67,ex:[['L-sit to handstand',4,1,3,'reps'],['Advanced tucked planche resets',4,3,6,'reps'],['Reverse wall handstand push up',4,2,6,'reps'],['Planche leans',4,4,8,'secs'],['Tricep extension (low bar)',3,6,12,'reps'],['Pistol squat (right)',3,6,12,'reps'],['Pistol squat (left)',3,6,12,'reps'],['Alternating side lunge',3,12,24,'reps']]},{name:'PULL / CORE 2',duration:53,ex:[['Straddle backlever',3,1,15,'secs'],['Assisted straddle frontlever',3,5,15,'secs'],['Muscle up',4,2,8,'reps'],['Advanced tucked backlever raise',3,3,6,'reps'],['Tucked frontlever pull up',3,6,12,'reps'],['L-sit hold',3,10,30,'secs'],['Toes to bar',3,6,12,'reps']]}];
const key='mano-kalistenika-v1';let db={};try{db=JSON.parse(localStorage.getItem(key))||{}}catch{};const save=()=>localStorage.setItem(key,JSON.stringify(db));const week=document.querySelector('#week');for(let i=1;i<=12;i++)week.add(new Option(`Savaitė ${i}`,i));week.value=db.selectedWeek||1;week.onchange=()=>{db.selectedWeek=+week.value;save();render()};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function get(w,d,e,ex){let k=`${w}-${d}-${e}`;if(!db[k])db[k]={sets:Array.from({length:ex[1]},()=>({reps:ex[4]==='reps'?ex[2]:'',secs:ex[4]==='secs'?ex[2]:'',done:false})),notes:''};return db[k]};function render(){const w=+week.value;document.querySelector('#app').innerHTML=workouts.map((wo,d)=>`<section class="work"><div class="workhead" onclick="toggle(${d})"><div><b>${wo.name}</b><div class="stats">${wo.ex.length} pratimai · ${wo.duration} min.</div></div><span id="arrow${d}">⌄</span></div><div class="details hidden" id="details${d}">${wo.ex.map((ex,e)=>{const data=get(w,d,e,ex);return `<article class="exercise"><div class="exhead"><div><b>${escapeHtml(ex[0])}</b><small>Planas: ${ex[1]} × ${ex[2]}–${ex[3]} ${ex[4]}</small></div><span id="count${d}-${e}">${data.sets.filter(s=>s.done).length}/${data.sets.length}</span></div><div class="stats">Kiekviena eilutė – viena serija: pakartojimai, sekundės, atlikta</div><div id="sets${d}-${e}">${data.sets.map((s,i)=>setRow(d,e,i,s)).join('')}</div><button class="mini" onclick="addSet(${d},${e})">+ Pridėti seriją</button><textarea class="notes" placeholder="Notes – tavo pastabos" oninput="note(${d},${e},this.value)">${escapeHtml(data.notes)}</textarea></article>`}).join('')}</div></section>`).join('');save()};function setRow(d,e,i,s){return `<div class="fields"><input type="number" min="0" placeholder="Reps" aria-label="Pakartojimai" value="${s.reps}" onchange="field(${d},${e},${i},'reps',this.value)"><input type="number" min="0" placeholder="Secs" aria-label="Sekundės" value="${s.secs}" onchange="field(${d},${e},${i},'secs',this.value)"><button class="${s.done?'done':''}" onclick="mark(${d},${e},${i})">${s.done?'✓':'○'}</button><button title="Pašalinti seriją" onclick="removeSet(${d},${e},${i})">×</button></div>`}function toggle(d){const el=document.querySelector('#details'+d);el.classList.toggle('hidden');document.querySelector('#arrow'+d).textContent=el.classList.contains('hidden')?'⌄':'⌃'}function field(d,e,i,f,v){get(+week.value,d,e,workouts[d].ex[e]).sets[i][f]=v===''?'':Math.max(0,+v);save()}function note(d,e,v){get(+week.value,d,e,workouts[d].ex[e]).notes=v;save()}function refresh(d,e){const x=get(+week.value,d,e,workouts[d].ex[e]);document.querySelector(`#sets${d}-${e}`).innerHTML=x.sets.map((s,i)=>setRow(d,e,i,s)).join('');document.querySelector(`#count${d}-${e}`).textContent=`${x.sets.filter(s=>s.done).length}/${x.sets.length}`;save()}function mark(d,e,i){const x=get(+week.value,d,e,workouts[d].ex[e]);x.sets[i].done=!x.sets[i].done;refresh(d,e)}function addSet(d,e){get(+week.value,d,e,workouts[d].ex[e]).sets.push({reps:'',secs:'',done:false});refresh(d,e)}function removeSet(d,e,i){get(+week.value,d,e,workouts[d].ex[e]).sets.splice(i,1);refresh(d,e)}document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({program:workouts,progress:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mano-kalistenika-duomenys.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};render();
</script></html>
