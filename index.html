<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111714"><title>Mano kalistenika</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#0c100e;color:#eef5ef}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101712f5;border-bottom:1px solid #27342a;padding:15px 16px;z-index:2}h1{font-size:22px;margin:0 0 3px}small,.muted{color:#9eaea2}main{max-width:740px;margin:auto;padding:16px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}select,button,input,textarea{font:inherit;color:inherit;background:#1b251f;border:1px solid #37483c;border-radius:9px;padding:9px}button{cursor:pointer}button.primary,.active{background:#b2ef63!important;color:#14200d!important;border-color:#b2ef63!important;font-weight:700}.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}.days button{text-align:left;min-height:65px}.days small{display:block;margin-top:4px;color:inherit;opacity:.72}.card{background:#151e18;border:1px solid #2b3a2e;border-radius:14px;padding:15px;margin:12px 0}.exercise h3{font-size:17px;margin:0 0 5px}.target{color:#b2ef63;font-size:13px;margin-bottom:12px}.set{display:grid;grid-template-columns:30px 1fr 86px 28px;align-items:center;gap:8px;margin:8px 0}.set input[type=number]{width:100%;min-width:0}.set input[type=checkbox]{width:22px;height:22px;accent-color:#b2ef63}.set.done{opacity:.65}.set.done label{text-decoration:line-through}textarea{width:100%;min-height:55px;resize:vertical;margin-top:8px}button.add{margin-top:7px;font-size:13px}.progress{height:10px;background:#2b382f;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#b2ef63;width:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.actions button{font-size:13px}.summary{font-size:14px;color:#aab9ac}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.timer strong{font-variant-numeric:tabular-nums;font-size:23px}footer{color:#9eaea2;font-size:12px;margin-top:22px}input[type=file]{display:none}
</style></head><body><header><div class="top"><div><h1>MANO KALISTENIKA</h1><small>12 savaičių • 4 treniruotės</small></div><label>Savaitė <select id="week"></select></label></div></header><main><div class="days" id="days"></div><div class="card"><div class="top"><b id="heading"></b><span id="pct" class="muted"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="summary" class="summary"></div></div><div class="card timer"><b>Poilsio laikmatis</b><strong id="clock">01:30</strong><button onclick="timerStart(90)">90 s</button><button onclick="timerStart(180)">3 min</button><button onclick="timerStop()">Stabdyti</button></div><div id="exercises"></div><div class="actions"><button onclick="exportData()">Išsaugoti atsarginę kopiją</button><button onclick="document.getElementById('backup').click()">Atkurti kopiją</button><input type="file" id="backup" accept=".json,application/json" onchange="importData(event)"></div><footer>Duomenys saugomi tik šioje naršyklėje. Jei pakeisi telefoną ar išvalysi naršyklės duomenis, naudok atsarginės kopijos funkciją. Automatinio sinchronizavimo tarp įrenginių nėra.</footer></main><script>
const PLAN=[["PUSH / LEGS 1",[["Handstand to L-sit",4,"1–3","reps"],["Straddle planche",4,"1–3","sec"],["Handstand push up",4,"1–5","reps"],["Assisted planche push up",3,"2–4","reps"],["Pseudo push up",3,"6–12","reps"],["Box jumps",3,"8–16","reps"],["Bulgarian split squat (left)",3,"10–20","reps"],["Bulgarian split squat (right)",3,"10–20","reps"]]],["PULL / CORE 1",[["Straddle frontlever",4,"1–10","sec"],["Assisted straddle backlever",4,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Weighted pull up",4,"4–8","reps"],["Single leg frontlever raise",4,"2–5","reps"],["Single leg dragon flag",4,"4–8","reps"],["Core compressions",3,"8–16","reps"]]],["PUSH / LEGS 2",[["L-sit to handstand",4,"1–3","reps"],["Advanced tucked planche resets",4,"3–6","reps"],["Reverse wall handstand push up",4,"2–6","reps"],["Planche leans",4,"4–8","sec"],["Tricep extension (low bar)",3,"6–12","reps"],["Pistol squat (right)",3,"6–12","reps"],["Pistol squat (left)",3,"6–12","reps"],["Alternating side lunge",3,"12–24","reps"]]],["PULL / CORE 2",[["Straddle backlever",3,"1–15","sec"],["Assisted straddle frontlever",3,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Advanced tucked backlever raise",3,"3–6","reps"],["Tucked frontlever pull up",3,"6–12","reps"],["L-sit hold",3,"10–30","sec"],["Toes to bar",3,"6–12","reps"]]]];
const KEY="mano-kalistenika-v1";let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let week=Number(localStorage.getItem(KEY+"-week")||1),day=Number(localStorage.getItem(KEY+"-day")||0);let interval=null,remaining=90;
const el=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const group=()=>week+"-"+day;const exkey=i=>group()+"-"+i;
function get(i){let k=exkey(i);if(!db[k])db[k]={sets:Array.from({length:PLAN[day][1][i][1]},()=>({done:false,value:""})),notes:""};return db[k]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function init(){for(let i=1;i<=12;i++)el("week").add(new Option(i,i));el("week").value=week;el("week").onchange=e=>{week=+e.target.value;localStorage.setItem(KEY+"-week",week);render()};render();clock()}
function render(){el("days").innerHTML=PLAN.map((p,i)=>'<button class="'+(day===i?"active":"")+'" onclick="pick('+i+')">'+esc(p[0])+'<small>'+p[1].length+' pratimai</small></button>').join("");el("heading").textContent=PLAN[day][0];el("exercises").innerHTML=PLAN[day][1].map((e,i)=>{const d=get(i);return '<section class="card exercise"><h3>'+(i+1)+'. '+esc(e[0])+'</h3><div class="target">'+e[1]+' serijos × '+esc(e[2])+' '+(e[3]==="sec"?"sek.":"kart.")+'</div>'+d.sets.map((s,j)=>'<div class="set '+(s.done?"done":"")+'"><input type="checkbox" aria-label="Atlikta serija '+(j+1)+'" '+(s.done?"checked":"")+' onchange="changeDone('+i+','+j+',this.checked)"><label>Serija '+(j+1)+'</label><input type="number" min="0" step="any" placeholder="'+(e[3]==="sec"?"sek.":"kart.")+'" value="'+esc(s.value)+'" oninput="changeValue('+i+','+j+',this.value)"><span class="muted">'+(e[3]==="sec"?"s":"×")+'</span></div>').join("")+'<button class="add" onclick="addSet('+i+')">+ Pridėti seriją</button><textarea placeholder="Pastabos: technika, pojūčiai, svoris…" oninput="changeNote('+i+',this.value)">'+esc(d.notes)+'</textarea></section>'}).join("");progress()}
function progress(){let all=0,done=0;PLAN[day][1].forEach((_,i)=>get(i).sets.forEach(s=>{all++;if(s.done)done++}));let p=all?Math.round(done/all*100):0;el("bar").style.width=p+"%";el("pct").textContent=p+"%";el("summary").textContent=done+" iš "+all+" serijų atlikta"}
function pick(i){day=i;localStorage.setItem(KEY+"-day",day);render()}
function changeDone(i,j,v){get(i).sets[j].done=v;save();progress()}
function changeValue(i,j,v){get(i).sets[j].value=v;save()}
function changeNote(i,v){get(i).notes=v;save()}
function addSet(i){get(i).sets.push({done:false,value:""});save();render()}
function clock(){el("clock").textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")}
function timerStop(){clearInterval(interval);interval=null}
function timerStart(s){timerStop();remaining=s;clock();interval=setInterval(()=>{remaining--;clock();if(remaining<=0){timerStop();alert("Poilsio laikas baigėsi!")}},1000)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,db},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mano-kalistenika-atsargine-kopija.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.db||typeof x.db!=="object")throw Error("Blogas failas");if(confirm("Atkurti kopiją? Dabartiniai įrašai bus pakeisti.")){db=x.db;save();render()}}catch(err){alert("Nepavyko atkurti kopijos: "+err.message)}};r.readAsText(f);e.target.value=""}
init();
</script></body></html>
