stretch:[[91,50,91,103],[91,75,52,98],[91,75,130,98],[91,103,51,140],[91,103,130,140]],
bridge:[[38,126,72,76],[72,76,116,75],[116,75,155,126],[38,126,24,145],[155,126,169,145]],
plank:[[40,85,125,85],[65,85,60,136],[95,85,101,136],[125,85,168,100],[125,85,168,114]],
core:[[48,104,91,80],[91,80,152,92],[60,98,42,138],[91,80,130,41]],
stand:[[90,51,90,101],[90,74,56,99],[90,74,125,99],[90,101,70,153],[90,101,113,153]]
};
function poseType(name){
const n=name.toLowerCase();
if(n.includes("human flag"))return "flag";
if(n.includes("frontlever")||n.includes("backlever"))return "lever";
if(n.includes("muscle up"))return "muscle";
if(n.includes("handstand")||n.includes("headstand"))return "handstand";
if(n.includes("planche"))return "planche";
if(n.includes("pull up")||n.includes("chin up")||n.includes("hang"))return "pull";
if(n.includes("l-sit")||n.includes("v-sit"))return "lsit";
if(n.includes("dragon flag"))return "dragon";
if(n.includes("dip"))return "muscle";
if(n.includes("push up")||n.includes("tricep extension"))return "push";
if(n.includes("pistol")||n.includes("squat"))return "squat";
if(n.includes("lunge"))return "lunge";
if(n.includes("jump"))return "jump";
if(n.includes("bridge"))return "bridge";
if(n.includes("plank"))return "plank";
if(n.includes("stretch")||n.includes("fold"))return "stretch";
if(n.includes("raise")||n.includes("core")||n.includes("hollow")||n.includes("toes to bar")||n.includes("windshield"))return "core";
return "stand";
}
function illustration(name){
const n=name.toLowerCase();
let i=0;
if(n.includes("human flag"))i=23;
else if(n.includes("frontlever"))i=n.includes("advanced")||n.includes("tuck")?21:20;
else if(n.includes("backlever"))i=22;
else if(n.includes("muscle up"))i=3;
else if(n.includes("planche"))i=n.includes("straddle")?17:n.includes("tuck")?16:15;
else if(n.includes("handstand")||n.includes("headstand"))i=n.includes("push")?11:13;
else if(n.includes("pull up")||n.includes("chin up"))i=n.includes("chin")?1:0;
else if(n.includes("dip"))i=n.includes("bar")?5:4;
else if(n.includes("pike"))i=10;
else if(n.includes("push up"))i=6;
else if(n.includes("l-sit")||n.includes("v-sit"))i=n.includes("v-sit")?25:24;
else if(n.includes("dragon flag"))i=47;
else if(n.includes("toes to bar"))i=41;
else if(n.includes("windshield"))i=48;
else if(n.includes("leg raise"))i=40;
else if(n.includes("hollow"))i=45;
else if(n.includes("core")||n.includes("compression"))i=26;
else if(n.includes("pistol"))i=27;
else if(n.includes("bulgarian"))i=31;
else if(n.includes("squat"))i=30;
else if(n.includes("lunge"))i=57;
else if(n.includes("jump"))i=33;
else if(n.includes("deadlift"))i=36;
else if(n.includes("bridge"))i=36;
else if(n.includes("plank"))i=51;
else if(n.includes("stretch")||n.includes("fold"))i=26;
else if(n.includes("burpee"))i=55;
else if(n.includes("hang"))i=40;
else if(n.includes("raise"))i=40;
else if(n.includes("ring"))i=4;
const x=i%10,y=Math.floor(i/10);
return '<div class="exercise-photo atlas-photo" role="img" aria-label="Panašaus judesio '+esc(name)+' paveikslėlis" style="background-position:'+x*100/9+'% '+y*100/5+'%"></div>';
}
function demo(name){return '<div class="demo">'+illustration(name)+'<div><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+' calisthenics exercise tutorial')+'">Žiūrėti pratimą ↗</a><small>Paveikslėlis rodo pratimo grupę; tikslų variantą žiūrėk vaizdo įraše.</small></div></div>'}
function render(){if(day>=currentPlan().length){day=0;localStorage.setItem(KEY+"-day",day)}el("days").innerHTML=currentPlan().map((p,i)=>'<button class="'+(day===i?"active":"")+'" onclick="pick('+i+')">'+esc(p[0])+'<small>'+p[1].length+' pratimai</small></button>').join("");el("heading").textContent=currentPlan()[day][0];el("exercises").innerHTML=currentPlan()[day][1].map((e,i)=>{const d=get(i);return '<section class="card exercise"><h3>'+(i+1)+'. '+esc(e[0])+'</h3>'+demo(e[0])+previousWeek(i)+'<div class="target">'+e[1]+' serijos × '+esc(e[2])+' '+(e[3]==="sec"?"sek.":"kart.")+'</div>'+d.sets.map((s,j)=>'<div class="set '+(s.done?"done":"")+'"><input type="checkbox" aria-label="Atlikta serija '+(j+1)+'" '+(s.done?"checked":"")+' onchange="changeDone('+i+','+j+',this.checked)"><label>Serija '+(j+1)+'</label><input type="number" min="0" step="any" placeholder="'+(e[3]==="sec"?"sek.":"kart.")+'" value="'+esc(s.value)+'" oninput="changeValue('+i+','+j+',this.value)"><span class="muted">'+(e[3]==="sec"?"s":"×")+'</span><button class="remove" title="Pašalinti seriją" aria-label="Pašalinti seriją '+(j+1)+'" onclick="removeSet('+i+','+j+')">×</button></div>').join("")+'<button class="add" onclick="addSet('+i+')">+ Pridėti seriją</button><textarea placeholder="Pastabos: technika, pojūčiai, svoris…" oninput="changeNote('+i+',this.value)">'+esc(d.notes)+'</textarea></section>'}).join("");progress()}
function progress(){let all=0,done=0;currentPlan()[day][1].forEach((_,i)=>get(i).sets.forEach(s=>{all++;if(s.done)done++}));let p=all?Math.round(done/all*100):0;el("bar").style.width=p+"%";el("pct").textContent=p+"%";el("summary").textContent=done+" iš "+all+" serijų atlikta"}
function pick(i){day=i;localStorage.setItem(KEY+"-day",day);render()}
function changeDone(i,j,v){get(i).sets[j].done=v;save();progress()}
function changeValue(i,j,v){get(i).sets[j].value=v;save()}
function changeNote(i,v){get(i).notes=v;save()}
function addSet(i){get(i).sets.push({done:false,value:""});save();render()}
function removeSet(i,j){const d=get(i);const set=d.sets[j];if(!set)return;if((set.done||set.value!=="")&&!confirm("Pašalinti šią seriją su jos įrašais?"))return;d.sets.splice(j,1);save();render()}
function clock(){el("clock").textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")}
function timerStop(){clearInterval(interval);interval=null}
function timerStart(s){timerStop();remaining=s;clock();interval=setInterval(()=>{remaining--;clock();if(remaining<=0){timerStop();alert("Poilsio laikas baigėsi!")}},1000)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,db},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mano-kalistenika-atsargine-kopija.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.db||typeof x.db!=="object")throw Error("Blogas failas");if(confirm("Atkurti kopiją? Dabartiniai įrašai bus pakeisti.")){db=x.db;save();render()}}catch(err){alert("Nepavyko atkurti kopijos: "+err.message)}};r.readAsText(f);e.target.value=""}
init();
</script></body></html>
