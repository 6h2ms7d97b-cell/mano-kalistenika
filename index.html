<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111714"><title>Mano kalistenika</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#0c100e;color:#eef5ef}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101712f5;border-bottom:1px solid #27342a;padding:15px 16px;z-index:2}.selectors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.selectors label{font-size:13px;white-space:nowrap}.selectors select{padding:7px}.top{flex-wrap:wrap}h1{font-size:22px;margin:0 0 3px}small,.muted{color:#9eaea2}main{max-width:740px;margin:auto;padding:16px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}select,button,input,textarea{font:inherit;color:inherit;background:#1b251f;border:1px solid #37483c;border-radius:9px;padding:9px}button{cursor:pointer}button.primary,.active{background:#b2ef63!important;color:#14200d!important;border-color:#b2ef63!important;font-weight:700}.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}.days button{text-align:left;min-height:65px}.days small{display:block;margin-top:4px;color:inherit;opacity:.72}.card{background:#151e18;border:1px solid #2b3a2e;border-radius:14px;padding:15px;margin:12px 0}.exercise h3{font-size:17px;margin:0 0 5px}.demo{display:flex;align-items:center;gap:14px;background:#0e1611;border:1px solid #2c3c30;border-radius:11px;padding:8px 11px;margin:9px 0 12px}.exercise-photo{width:118px;height:100px;flex:none;background-image:url("./exercise-grid.png");background-size:500% 600%;background-repeat:no-repeat;border-radius:50%;background-color:#263a3c;box-shadow:0 0 0 2px #4a6965}.demo a{color:#b2ef63;font-size:14px;font-weight:650;text-decoration:underline;text-underline-offset:3px}.demo small{display:block;margin-top:5px;font-size:11px}.demo a.techlink{display:block;margin-top:9px;font-size:12px;color:#c9d6ff}.previous{background:#202d27;border:1px solid #3d5547;border-radius:8px;padding:9px 10px;margin:9px 0;color:#d9e6dd;font-size:13px;line-height:1.6}.previous strong{color:#b2ef63}.target{color:#b2ef63;font-size:13px;margin-bottom:12px}.set{display:grid;grid-template-columns:30px minmax(0,1fr) 76px 20px 35px;align-items:center;gap:8px;margin:8px 0}.set input[type=number]{width:100%;min-width:0}.set input[type=checkbox]{width:22px;height:22px;accent-color:#b2ef63}.remove{background:#302020;border:1px solid #714040;color:#ffb5b5;padding:5px 0;font-size:20px;line-height:1.1;min-width:32px}.set.done{opacity:.65}.set.done label{text-decoration:line-through}textarea{width:100%;min-height:55px;resize:vertical;margin-top:8px}button.add{margin-top:7px;font-size:13px}.progress{height:10px;background:#2b382f;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#b2ef63;width:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.actions button{font-size:13px}.summary{font-size:14px;color:#aab9ac}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.timer strong{font-variant-numeric:tabular-nums;font-size:23px}footer{color:#9eaea2;font-size:12px;margin-top:22px}input[type=file]{display:none}
</style></head><body><header><div class="top"><div><h1>MANO KALISTENIKA</h1><small>12 savaičių • 4 treniruotės</small></div><div class="selectors"><label>Lygis <select id="level"><option value="4">4</option><option value="5">5</option><option value="6">Handstand Mastery 4</option><option value="7">Handstand Mastery 5</option></select></label><label>Savaitė <select id="week"></select></label></div></div></header><main><div class="days" id="days"></div><div class="card"><div class="top"><b id="heading"></b><span id="pct" class="muted"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="summary" class="summary"></div></div><div class="card timer"><b>Poilsio laikmatis</b><strong id="clock">01:30</strong><button onclick="timerStart(90)">90 s</button><button onclick="timerStart(180)">3 min</button><button onclick="timerStop()">Stabdyti</button></div><div id="exercises"></div><div class="actions"><button onclick="exportData()">Išsaugoti atsarginę kopiją</button><button onclick="document.getElementById('backup').click()">Atkurti kopiją</button><input type="file" id="backup" accept=".json,application/json" onchange="importData(event)"></div><footer>Duomenys saugomi tik šioje naršyklėje. Jei pakeisi telefoną ar išvalysi naršyklės duomenis, naudok atsarginės kopijos funkciją. Automatinio sinchronizavimo tarp įrenginių nėra.</footer></main><script>
const PLAN=[["PUSH / LEGS 1",[["Handstand to L-sit",4,"1–3","reps"],["Straddle planche",4,"1–3","sec"],["Handstand push up",4,"1–5","reps"],["Assisted planche push up",3,"2–4","reps"],["Pseudo push up",3,"6–12","reps"],["Box jumps",3,"8–16","reps"],["Bulgarian split squat (left)",3,"10–20","reps"],["Bulgarian split squat (right)",3,"10–20","reps"]]],["PULL / CORE 1",[["Straddle frontlever",4,"1–10","sec"],["Assisted straddle backlever",4,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Weighted pull up",4,"4–8","reps"],["Single leg frontlever raise",4,"2–5","reps"],["Single leg dragon flag",4,"4–8","reps"],["Core compressions",3,"8–16","reps"]]],["PUSH / LEGS 2",[["L-sit to handstand",4,"1–3","reps"],["Advanced tucked planche resets",4,"3–6","reps"],["Reverse wall handstand push up",4,"2–6","reps"],["Planche leans",4,"4–8","sec"],["Tricep extension (low bar)",3,"6–12","reps"],["Pistol squat (right)",3,"6–12","reps"],["Pistol squat (left)",3,"6–12","reps"],["Alternating side lunge",3,"12–24","reps"]]],["PULL / CORE 2",[["Straddle backlever",3,"1–15","sec"],["Assisted straddle frontlever",3,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Advanced tucked backlever raise",3,"3–6","reps"],["Tucked frontlever pull up",3,"6–12","reps"],["L-sit hold",3,"10–30","sec"],["Toes to bar",3,"6–12","reps"]]]];
const PLAN5=[["PUSH / LEGS 1",[["Straddle planche",3,"1–5","sec"],["Straight arm l-sit to handstand",3,"1–2","reps"],["Handstand to 90 degree hold",3,"1–10","sec"],["Handstand push up",3,"1–5","reps"],["Assisted planche push up",3,"3–6","reps"],["Weighted pistol squat (left)",3,"5–10","reps"],["Weighted pistol squat (right)",3,"5–10","reps"],["Single leg deadlift (left)",3,"10–20","reps"],["Single leg deadlift (right)",3,"10–20","reps"]]],["PULL / CORE 1",[["Full frontlever",4,"1–5","sec"],["Assisted full backlever",4,"5–15","sec"],["Strict muscle up",4,"1–5","reps"],["Straddle frontlever raise",4,"1–5","reps"],["L-sit pull up",3,"6–12","reps"],["Full dragon flags",3,"3–6","reps"],["V-up parallel bar",3,"6–12","reps"]]],["PUSH / LEGS 2",[["Handstand to straddle planche",4,"1–3","sec"],["90 degree handstand push up",4,"1–3","reps"],["Assisted planche press",4,"1–5","reps"],["Handstand push up hold (bottom)",4,"5–15","sec"],["Elevated pike push up (high)",3,"6–12","reps"],["Balanced pistol squat (left)",3,"6–12","reps"],["Balanced pistol squat (right)",3,"6–12","reps"],["Weighted alternating lunge",3,"8–16","reps"]]],["PULL / CORE 2",[["Full backlever",4,"1–10","sec"],["Assisted full frontlever",4,"5–10","sec"],["Strict muscle up",4,"1–5","reps"],["Advanced tucked frontlever pull up",4,"3–6","reps"],["Backlever pulses",4,"3–6","reps"],["V-sit",3,"1–5","sec"],["Windshield wipers",3,"8–16","reps"]]]];
const HANDSTAND=[["HANDSTAND TRAINING 1",[["Seated wall arm raise",3,"5–10","reps"],["Freestanding handstand hold",5,"5–20","sec"],["Tucked to headstand",4,"3–6","reps"],["Frog to handstand kick up",4,"1–3","reps"],["Handstand side walks (back to wall)",4,"10–20","reps"],["One arm plank (left)",4,"25–50","sec"],["One arm plank (right)",4,"25–50","sec"],["Half bridge (arms behind back)",4,"20–40","sec"]]],["HANDSTAND TRAINING 2",[["Straight arms behind back stretch",3,"20–40","sec"],["Freestanding handstand hold",5,"5–20","sec"],["Reverse wall support handstand practice",5,"5–30","sec"],["Pike wall shoulder taps",4,"10–20","reps"],["Elevated plank to pike walks",4,"5–10","reps"],["Hollow body hold",4,"40–80","sec"],["Belly shoulder stretch (left)",4,"20–40","sec"],["Belly shoulder stretch (right)",4,"20–40","sec"]]],["HANDSTAND TRAINING 3",[["Sleeper stretch (left)",3,"20–40","sec"],["Sleeper stretch (right)",3,"20–40","sec"],["Freestanding handstand hold",5,"5–20","sec"],["Wall tucked to handstand",4,"4–8","reps"],["Handstand waist taps (back to wall)",4,"4–8","reps"],["Elevated scapula pike push up",4,"8–16","reps"],["Reverse leg raise",4,"12–24","reps"],["Wide legged standing forward fold",4,"20–40","sec"]]]];
const HANDSTAND5=[["HANDSTAND WORKOUT 1",[["Prone shoulder flexion lift",3,"10–20","reps"],["Freestanding handstand hold",5,"10–30","sec"],["Press to headstand (reps)",3,"3–6","reps"],["Frog to handstand",3,"2–4","reps"],["Handstand side walks (chest to wall)",3,"10–20","reps"],["Straight arm side plank (left)",3,"30–60","sec"],["Straight arm side plank (right)",3,"30–60","sec"],["Full bridge",3,"30–60","sec"]]],["HANDSTAND WORKOUT 2",[["Straight arms behind back stretch",3,"20–40","sec"],["Freestanding handstand hold",5,"10–30","sec"],["Reverse wall support handstand practice",3,"10–30","sec"],["Plank to wall walks",3,"3–6","reps"],["Handstand shoulder taps (chest to wall)",3,"12–24","reps"],["Hollow body hold (weighted)",3,"40–80","sec"],["Tread the needle (left)",3,"20–40","sec"],["Tread the needle (right)",3,"20–40","sec"]]],["HANDSTAND WORKOUT 3",[["Internal stretch (elbow in knees)",3,"20–40","sec"],["Freestanding handstand hold",5,"10–30","sec"],["Tucked to handstand",3,"1–5","reps"],["Handstand waist taps (chest to wall)",3,"10–20","reps"],["Chest to wall handstand scapula push up",3,"8–16","reps"],["Weighted elevated superman hold",3,"45–90","sec"],["Standing forward fold",3,"30–60","sec"]]]];
let level=Number(localStorage.getItem("mano-kalistenika-level")||4);function currentPlan(){return level===7?HANDSTAND5:level===6?HANDSTAND:level===5?PLAN5:PLAN}
const KEY="mano-kalistenika-v1";let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let week=Number(localStorage.getItem(KEY+"-week")||1),day=Number(localStorage.getItem(KEY+"-day")||0);let interval=null,remaining=90;
const el=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const group=()=> (level===7?"HS5-":level===6?"HS4-":level===5?"L5-":"")+week+"-"+day;const exkey=i=>group()+"-"+i;
function previousWeek(i){if(week<=1)return "";const name=currentPlan()[day][1][i][0];const priorKey=(level===6?"HS4-":level===5?"L5-":"")+(week-1)+"-"+day;const p=db[priorKey+"-"+i];if(!p||!Array.isArray(p.sets))return '<div class="previous">Praėjusi savaitė: rezultatų nėra</div>';const priorName=currentPlan()[day][1][i][0];const values=p.sets.map((x,j)=>x.value!==""&&x.value!=null?esc(x.value)+(currentPlan()[day][1][i][3]==="sec"?" s":" k."):(x.done?"atlikta":"–"));if(!p.sets.some(x=>x.done||(x.value!==""&&x.value!=null)))return '<div class="previous">Praėjusi savaitė: rezultatų nėra</div>';return '<div class="previous"><strong>Praėjusi savaitė:</strong> '+values.map((v,j)=>'<span title="Serija '+(j+1)+'">'+v+'</span>').join(' · ')+'</div>'}
function get(i){let k=exkey(i);if(!db[k])db[k]={sets:Array.from({length:currentPlan()[day][1][i][1]},()=>({done:false,value:""})),notes:""};return db[k]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function syncWeeks(){const w=el("week"),max=level>=6?8:12;w.innerHTML="";for(let i=1;i<=max;i++)w.add(new Option(i,i));if(week>max)week=max;w.value=week;}
function init(){el("level").value=level;el("level").onchange=e=>{level=+e.target.value;day=0;week=Math.min(week,level>=6?8:12);localStorage.setItem("mano-kalistenika-level",level);localStorage.setItem(KEY+"-day",day);localStorage.setItem(KEY+"-week",week);syncWeeks();render()};syncWeeks();el("week").onchange=e=>{week=+e.target.value;localStorage.setItem(KEY+"-week",week);render()};render();clock()}


function illustration(name){
const n=name.toLowerCase();
let i=0;
if(n.includes("straddle planche"))i=0;
else if(n.includes("l-sit to handstand"))i=1;
else if(n.includes("planche")&&n.includes("push"))i=4;
else if(n.includes("planche"))i=2;
else if(n.includes("handstand")&&n.includes("90"))i=16;
else if(n.includes("handstand")&&n.includes("push"))i=3;
else if(n.includes("handstand"))i=18;
else if(n.includes("pike"))i=19;
else if(n.includes("pistol"))i=5;
else if(n.includes("deadlift"))i=7;
else if(n.includes("lunge"))i=21;
else if(n.includes("bulgarian"))i=29;
else if(n.includes("jump"))i=28;
else if(n.includes("frontlever")&&n.includes("raise"))i=25;
else if(n.includes("frontlever")&&n.includes("pull"))i=23;
else if(n.includes("frontlever")&&n.includes("straddle"))i=11;
else if(n.includes("frontlever"))i=8;
else if(n.includes("backlever")&&n.includes("pulse"))i=24;
else if(n.includes("backlever"))i=9;
else if(n.includes("muscle up"))i=10;
else if(n.includes("pull up"))i=12;
else if(n.includes("dragon"))i=13;
else if(n.includes("windshield"))i=27;
else if(n.includes("toes to bar"))i=22;
else if(n.includes("v-sit")||n.includes("v-up"))i=14;
else if(n.includes("l-sit")||n.includes("compression"))i=26;
else if(n.includes("push up"))i=17;
else if(n.includes("tricep"))i=10;
const col=i%5,row=Math.floor(i/5);
return '<div class="exercise-photo" role="img" aria-label="'+esc(name)+' – iliustracinė nuotrauka" style="background-position:'+col*25+'% '+row*20+'%"></div>';
}
function referenceUrl(name){const n=name.toLowerCase();if(n.includes("planche"))return "https://danielhristov.com/blog/learn-planche-at-home";if(n.includes("frontlever"))return "https://calisthenicsnerd.com/2020/12/05/how-to-front-lever-step-by-step-guide/";if(n.includes("backlever"))return "https://www.bergmovement.com/calisthenics-blog/back-lever-tutorial";return ""}
function demo(name){return '<div class="demo">'+illustration(name)+'<div><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+' calisthenics exercise tutorial')+'">Žiūrėti pratimą ↗</a><small>Spalvota iliustracija. Techniką tikrink vaizdo įraše.</small></div></div>'}
function render(){if(day>=currentPlan().length){day=0;localStorage.setItem(KEY+"-day",day)}el("days").innerHTML=currentPlan().map((p,i)=>'<button class="'+(day===i?"active":"")+'" onclick="pick('+i+')">'+esc(p[0])+'<small>'+p[1].length+' pratimai</small></button>').join("");el("heading").textContent=currentPlan()[day][0];el("exercises").innerHTML=currentPlan()[day][1].map((e,i)=>{const d=get(i);return '<section class="card exercise"><h3>'+(i+1)+'. '+esc(e[0])+'</h3>'+demo(e[0])+previousWeek(i)+'<div class="target">'+e[1]+' serijos × '+esc(e[2])+' '+(e[3]==="sec"?"sek.":"kart.")+'</div>'+d.sets.map((s,j)=>'<div class="set '+(s.done?"done":"")+'"><input type="checkbox" aria-label="Atlikta serija '+(j+1)+'" '+(s.done?"checked":"")+' onchange="changeDone('+i+','+j+',this.checked)"><label>Serija '+(j+1)+'</label><input type="number" min="0" step="any" placeholder="'+(e[3]==="sec"?"sek.":"kart.")+'" value="'+esc(s.value)+'" oninput="changeValue('+i+','+j+',this.value)"><span class="muted">'+(e[3]==="sec"?"s":"×")+'</span><button class="remove" title="Pašalinti seriją" aria-label="Pašalinti seriją '+(j+1)+'" onclick="removeSet('+i+','+j+')">×</button></div>').join("")+'<button class="add" onclick="addSet('+i+')">+ Pridėti seriją</button><textarea placeholder="Pastabos: technika, pojūčiai, svoris…" oninput="changeNote('+i+',this.value)">'+esc(d.notes)+'</textarea></section>'}).join("");progress()}
function progress(){let all=0,done=0;currentPlan()[day][1].forEach((_,i)=>get(i).sets.forEach(s=>{all++;if(s.done)done++}));let p=all?Math.round(done/all*100):0;el("bar").style.width=p+"%";el("pct").textContent=p+"%";el("summary").textContent=done+" iš "+all+" serijų atlikta"}
function pick(i){day=i;localStorage.setItem(KEY+"-day",day);render()}
function changeDone(i,j,v){get(i).sets[j].done=v;save();progress()}
function changeValue(i,j,v){get(i).sets[j].value=v;save()}
function changeNote(i,v){get(i).notes=v;save()}
function addSet(i){get(i).sets.push({done:false,value:""});save();render()}
function removeSet(i,j){const d=get(i);const set=d.sets[j];if(!set)return;if((set.done||set.value!=="")&&!confirm("Pašalinti šią seriją su jos įrašais?"))return;d.sets.splice(j,1);save();render()}
function clock(){el("clock").textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")}
function timerStop(){clearInterval(interval);interval=null}
function timerStart(s){timerStop();remaining=s;clock();interval=setInterval(()=>{remaining--;clock();if(remaining<=0){timerStop();alert("Poilsio laikas baigėsi!")}},1000)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,db},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mano-kalistenika-atsargine-kopija.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.db||typeof x.db!=="object")throw Error("Blogas failas");if(confirm("Atkurti kopiją? Dabartiniai įrašai bus pakeisti.")){db=x.db;save();render()}}catch(err){alert("Nepavyko atkurti kopijos: "+err.message)}};r.readAsText(f);e.target.value=""}
init();
</script></body></html>
