<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111714"><title>Mano kalistenika</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#0c100e;color:#eef5ef}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101712f5;border-bottom:1px solid #27342a;padding:15px 16px;z-index:2}.selectors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.selectors label{font-size:13px;white-space:nowrap}.selectors select{padding:7px}.top{flex-wrap:wrap}h1{font-size:22px;margin:0 0 3px}small,.muted{color:#9eaea2}main{max-width:740px;margin:auto;padding:16px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}select,button,input,textarea{font:inherit;color:inherit;background:#1b251f;border:1px solid #37483c;border-radius:9px;padding:9px}button{cursor:pointer}button.primary,.active{background:#b2ef63!important;color:#14200d!important;border-color:#b2ef63!important;font-weight:700}.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}.days button{text-align:left;min-height:65px}.days small{display:block;margin-top:4px;color:inherit;opacity:.72}.card{background:#151e18;border:1px solid #2b3a2e;border-radius:14px;padding:15px;margin:12px 0}.exercise h3{font-size:17px;margin:0 0 5px}.demo{display:flex;align-items:center;gap:14px;background:#0e1611;border:1px solid #2c3c30;border-radius:11px;padding:8px 11px;margin:9px 0 12px}.demo svg{width:118px;height:100px;flex:none}.demo a{color:#b2ef63;font-size:14px;font-weight:650;text-decoration:underline;text-underline-offset:3px}.demo small{display:block;margin-top:5px;font-size:11px}.demo a.techlink{display:block;margin-top:9px;font-size:12px;color:#c9d6ff}.target{color:#b2ef63;font-size:13px;margin-bottom:12px}.set{display:grid;grid-template-columns:30px minmax(0,1fr) 76px 20px 35px;align-items:center;gap:8px;margin:8px 0}.set input[type=number]{width:100%;min-width:0}.set input[type=checkbox]{width:22px;height:22px;accent-color:#b2ef63}.remove{background:#302020;border:1px solid #714040;color:#ffb5b5;padding:5px 0;font-size:20px;line-height:1.1;min-width:32px}.set.done{opacity:.65}.set.done label{text-decoration:line-through}textarea{width:100%;min-height:55px;resize:vertical;margin-top:8px}button.add{margin-top:7px;font-size:13px}.progress{height:10px;background:#2b382f;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#b2ef63;width:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.actions button{font-size:13px}.summary{font-size:14px;color:#aab9ac}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.timer strong{font-variant-numeric:tabular-nums;font-size:23px}footer{color:#9eaea2;font-size:12px;margin-top:22px}input[type=file]{display:none}
</style></head><body><header><div class="top"><div><h1>MANO KALISTENIKA</h1><small>12 savaičių • 4 treniruotės</small></div><div class="selectors"><label>Lygis <select id="level"><option value="4">4</option><option value="5">5</option></select></label><label>Savaitė <select id="week"></select></label></div></div></header><main><div class="days" id="days"></div><div class="card"><div class="top"><b id="heading"></b><span id="pct" class="muted"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="summary" class="summary"></div></div><div class="card timer"><b>Poilsio laikmatis</b><strong id="clock">01:30</strong><button onclick="timerStart(90)">90 s</button><button onclick="timerStart(180)">3 min</button><button onclick="timerStop()">Stabdyti</button></div><div id="exercises"></div><div class="actions"><button onclick="exportData()">Išsaugoti atsarginę kopiją</button><button onclick="document.getElementById('backup').click()">Atkurti kopiją</button><input type="file" id="backup" accept=".json,application/json" onchange="importData(event)"></div><footer>Duomenys saugomi tik šioje naršyklėje. Jei pakeisi telefoną ar išvalysi naršyklės duomenis, naudok atsarginės kopijos funkciją. Automatinio sinchronizavimo tarp įrenginių nėra.</footer></main><script>
const PLAN=[["PUSH / LEGS 1",[["Handstand to L-sit",4,"1–3","reps"],["Straddle planche",4,"1–3","sec"],["Handstand push up",4,"1–5","reps"],["Assisted planche push up",3,"2–4","reps"],["Pseudo push up",3,"6–12","reps"],["Box jumps",3,"8–16","reps"],["Bulgarian split squat (left)",3,"10–20","reps"],["Bulgarian split squat (right)",3,"10–20","reps"]]],["PULL / CORE 1",[["Straddle frontlever",4,"1–10","sec"],["Assisted straddle backlever",4,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Weighted pull up",4,"4–8","reps"],["Single leg frontlever raise",4,"2–5","reps"],["Single leg dragon flag",4,"4–8","reps"],["Core compressions",3,"8–16","reps"]]],["PUSH / LEGS 2",[["L-sit to handstand",4,"1–3","reps"],["Advanced tucked planche resets",4,"3–6","reps"],["Reverse wall handstand push up",4,"2–6","reps"],["Planche leans",4,"4–8","sec"],["Tricep extension (low bar)",3,"6–12","reps"],["Pistol squat (right)",3,"6–12","reps"],["Pistol squat (left)",3,"6–12","reps"],["Alternating side lunge",3,"12–24","reps"]]],["PULL / CORE 2",[["Straddle backlever",3,"1–15","sec"],["Assisted straddle frontlever",3,"5–15","sec"],["Muscle up",4,"2–8","reps"],["Advanced tucked backlever raise",3,"3–6","reps"],["Tucked frontlever pull up",3,"6–12","reps"],["L-sit hold",3,"10–30","sec"],["Toes to bar",3,"6–12","reps"]]]];
const PLAN5=[["PUSH / LEGS 1",[["Straddle planche",3,"1–5","sec"],["Straight arm l-sit to handstand",3,"1–2","reps"],["Handstand to 90 degree hold",3,"1–10","sec"],["Handstand push up",3,"1–5","reps"],["Assisted planche push up",3,"3–6","reps"],["Weighted pistol squat (left)",3,"5–10","reps"],["Weighted pistol squat (right)",3,"5–10","reps"],["Single leg deadlift (left)",3,"10–20","reps"],["Single leg deadlift (right)",3,"10–20","reps"]]],["PULL / CORE 1",[["Full frontlever",4,"1–5","sec"],["Assisted full backlever",4,"5–15","sec"],["Strict muscle up",4,"1–5","reps"],["Straddle frontlever raise",4,"1–5","reps"],["L-sit pull up",3,"6–12","reps"],["Full dragon flags",3,"3–6","reps"],["V-up parallel bar",3,"6–12","reps"]]],["PUSH / LEGS 2",[["Handstand to straddle planche",4,"1–3","sec"],["90 degree handstand push up",4,"1–3","reps"],["Assisted planche press",4,"1–5","reps"],["Handstand push up hold (bottom)",4,"5–15","sec"],["Elevated pike push up (high)",3,"6–12","reps"],["Balanced pistol squat (left)",3,"6–12","reps"],["Balanced pistol squat (right)",3,"6–12","reps"],["Weighted alternating lunge",3,"8–16","reps"]]],["PULL / CORE 2",[["Full backlever",4,"1–10","sec"],["Assisted full frontlever",4,"5–10","sec"],["Strict muscle up",4,"1–5","reps"],["Advanced tucked frontlever pull up",4,"3–6","reps"],["Backlever pulses",4,"3–6","reps"],["V-sit",3,"1–5","sec"],["Windshield wipers",3,"8–16","reps"]]]];
let level=Number(localStorage.getItem("mano-kalistenika-level")||4);function currentPlan(){return level===5?PLAN5:PLAN}
const KEY="mano-kalistenika-v1";let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let week=Number(localStorage.getItem(KEY+"-week")||1),day=Number(localStorage.getItem(KEY+"-day")||0);let interval=null,remaining=90;
const el=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const group=()=> (level===5?"L5-":"")+week+"-"+day;const exkey=i=>group()+"-"+i;
function get(i){let k=exkey(i);if(!db[k])db[k]={sets:Array.from({length:currentPlan()[day][1][i][1]},()=>({done:false,value:""})),notes:""};return db[k]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function init(){el("level").value=level;el("level").onchange=e=>{level=+e.target.value;localStorage.setItem("mano-kalistenika-level",level);render()};for(let i=1;i<=12;i++)el("week").add(new Option(i,i));el("week").value=week;el("week").onchange=e=>{week=+e.target.value;localStorage.setItem(KEY+"-week",week);render()};render();clock()}


function illustration(name){
const n=name.toLowerCase(),hash=[...n].reduce((a,c)=>a+c.charCodeAt(0),0);
const colors=["#9bd8e2","#f2bf87","#c3a9e8","#f3a9a6","#b6dfad","#edb1d3","#a6c9fa"];
const bg=colors[hash%colors.length], back=n.includes("backlever"),front=n.includes("frontlever"),straddle=n.includes("straddle"),tuck=n.includes("tuck"),single=n.includes("single leg"),assisted=n.includes("assisted"),left=n.includes("left");
const path=(d,color="#283f52",w=9)=>'<path d="'+d+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
const head=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="7" fill="#e8b18b" stroke="#825c4b" stroke-width="1.5"/>';
const torso=(d)=>path(d,"#263c50",12),skin=(d)=>path(d,"#e8b18b",7),legs=(d)=>path(d,"#354b66",10);
const bar=(d)=>path(d,"#415460",4);
let art="",kind="standing";
if(front||back)kind="lever";
else if(n.includes("muscle up"))kind="muscle";
else if(n.includes("pull up"))kind="pull";
else if(n.includes("dragon flag"))kind="dragon";
else if(n.includes("windshield"))kind="wipers";
else if(n.includes("toes to bar"))kind="toes";
else if(n.includes("planche")&&!n.includes("handstand"))kind="planche";
else if(n.includes("handstand")||n.includes("pike push"))kind="handstand";
else if(n.includes("pistol"))kind="pistol";
else if(n.includes("bulgarian"))kind="bulgarian";
else if(n.includes("lunge"))kind="lunge";
else if(n.includes("deadlift"))kind="deadlift";
else if(n.includes("box jump"))kind="jump";
else if(n.includes("l-sit")||n.includes("v-sit")||n.includes("v-up")||n.includes("compression"))kind="sit";
else if(n.includes("push up")||n.includes("tricep"))kind="push";
if(kind==="lever"){
art=bar("M7 17H113")+head(27,53)+torso("M37 53L70 53")+skin(back?"M46 52L48 29L48 17 M57 52L67 29L67 17":"M46 52L36 29L36 17 M57 52L58 29L58 17");
art+=tuck?legs("M70 53L82 68L70 76 M70 53L90 65L86 77"):straddle?legs("M70 53L106 30 M70 53L106 76"):single?legs("M70 53L106 53 M70 53L85 67L71 72"):legs("M70 53L108 53");
if(assisted)art+=path("M103 19L103 42","#ffffff",2);
if(n.includes("raise")||n.includes("pulse"))art+=path("M99 68Q109 58 102 45","#ffffff",2);
}else if(kind==="planche"){
const lean=n.includes("lean"),adv=n.includes("tuck")||n.includes("reset");
art=head(89,43)+torso(lean?"M79 48L53 55":"M79 48L51 48")+skin("M73 49L77 78 M62 51L56 78")+bar("M36 82H96");
art+=adv?legs("M51 48L38 60L48 69 M51 48L30 59L39 68"):straddle?legs("M51 48L12 28 M51 48L12 69"):lean?legs("M53 55L29 66L14 80 M53 55L36 75L27 83"):legs("M51 48L12 46");
if(n.includes("push up")||n.includes("press"))art+=path("M74 69L88 69","#ffffff",2);
}else if(kind==="handstand"){
const bent=n.includes("push up")||n.includes("90 degree"),sit=n.includes("l-sit");
art=bar("M32 88H90")+head(61,bent?65:73)+torso(bent?"M61 57L61 33":"M61 65L61 35")+skin(bent?"M58 57L41 65L40 85 M64 57L81 65L82 85":"M57 62L43 85 M65 62L79 85");
art+=sit?legs("M61 35L87 30L108 31 M61 35L86 45L107 46"):n.includes("straddle")?legs("M61 35L28 14 M61 35L94 14"):bent?legs("M61 33L46 15 M61 33L78 15"):legs("M61 35L61 8 M61 35L70 9");
}else if(kind==="muscle"){
art=bar("M13 39H107")+head(60,23)+torso("M60 31L60 63")+skin("M56 37L39 39 M64 37L81 39")+legs("M60 63L45 85 M60 63L75 85");
}else if(kind==="pull"){
const lsit=n.includes("l-sit"),weighted=n.includes("weighted");
art=bar("M12 13H108")+head(60,36)+torso("M60 44L60 65")+skin("M55 45L43 27L43 13 M65 45L77 27L77 13")+ (lsit?legs("M60 65L87 65L105 65 M60 65L87 75L105 75"):legs("M60 65L46 87 M60 65L74 87"));
if(weighted)art+='<circle cx="60" cy="83" r="6" fill="#546875"/>';
}else if(kind==="pistol"){
art=head(57,24)+torso("M57 32L55 55")+skin("M57 41L36 57 M57 41L76 54")+legs("M55 55L39 69L33 87 M55 55L83 65L107 65");
}else if(kind==="bulgarian"){
art=bar("M10 78H39")+head(65,19)+torso("M65 28L65 54")+skin("M65 36L46 50 M65 36L82 51")+legs("M65 54L83 68L84 88 M65 54L40 60L30 77");
}else if(kind==="lunge"){
art=head(59,18)+torso("M59 28L59 55")+skin("M59 35L42 48 M59 35L77 48")+legs("M59 55L34 67L22 85 M59 55L82 69L102 83");
}else if(kind==="deadlift"){
art=head(81,30)+torso("M75 37L49 52")+skin("M69 44L64 72 M58 49L50 72")+legs("M49 52L23 47 M49 52L54 83");
}else if(kind==="jump"){
art=bar("M84 88V64H115")+head(54,16)+torso("M54 25L54 50")+skin("M54 35L33 46 M54 35L76 43")+legs("M54 50L77 61L94 62 M54 50L34 66L24 78");
}else if(kind==="sit"){
const v=n.includes("v-"),compress=n.includes("compression");
art=bar("M8 86H112")+head(33,52)+torso("M40 58L62 70")+skin("M48 64L45 84 M58 69L61 84")+legs(v?"M62 70L80 32L94 19 M62 70L91 39L107 29":compress?"M62 70L84 49L101 50 M62 70L90 60L108 60":"M62 70L87 65L109 65 M62 70L87 75L109 75");
}else if(kind==="dragon"||kind==="wipers"||kind==="toes"){
art=bar(kind==="toes"?"M12 14H108":"M8 85H112");
art+=kind==="toes"?head(60,39)+torso("M60 47L60 64")+skin("M54 47L42 28L42 14 M66 47L78 28L78 14")+legs("M60 64L89 39L101 17 M60 64L95 45L106 24"):head(22,67)+torso("M31 66L62 56")+skin("M34 70L24 82 M45 63L43 82")+legs(kind==="wipers"?"M62 56L83 22 M62 56L107 40":"M62 56L84 30L106 21");
}else if(kind==="push"){
art=head(96,43)+torso("M86 47L57 57")+skin("M82 50L88 79 M66 54L65 80")+legs("M57 57L25 62L15 81");
}else{
art=head(60,22)+torso("M60 32L60 59")+skin("M60 38L39 54 M60 38L81 54")+legs("M60 59L44 85 M60 59L76 85");
}
if(left)art+='<circle cx="105" cy="12" r="7" fill="#243d51"/><text x="105" y="16" text-anchor="middle" fill="white" font-size="10">L</text>';
if(n.includes("right"))art+='<circle cx="105" cy="12" r="7" fill="#243d51"/><text x="105" y="16" text-anchor="middle" fill="white" font-size="10">R</text>';
return '<svg viewBox="0 0 120 100" role="img" aria-label="Pratimo '+esc(name)+' iliustracija" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="50" r="49" fill="'+bg+'"/><g>'+art+'</g></svg>';
}
function referenceUrl(name){const n=name.toLowerCase();if(n.includes("planche"))return "https://danielhristov.com/blog/learn-planche-at-home";if(n.includes("frontlever"))return "https://calisthenicsnerd.com/2020/12/05/how-to-front-lever-step-by-step-guide/";if(n.includes("backlever"))return "https://www.bergmovement.com/calisthenics-blog/back-lever-tutorial";return ""}
function demo(name){return '<div class="demo">'+illustration(name)+'<div><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+' calisthenics exercise tutorial')+'">Žiūrėti pratimą ↗</a><small>Spalvota iliustracija. Techniką tikrink vaizdo įraše.</small></div></div>'}
function render(){el("days").innerHTML=currentPlan().map((p,i)=>'<button class="'+(day===i?"active":"")+'" onclick="pick('+i+')">'+esc(p[0])+'<small>'+p[1].length+' pratimai</small></button>').join("");el("heading").textContent=currentPlan()[day][0];el("exercises").innerHTML=currentPlan()[day][1].map((e,i)=>{const d=get(i);return '<section class="card exercise"><h3>'+(i+1)+'. '+esc(e[0])+'</h3>'+demo(e[0])+'<div class="target">'+e[1]+' serijos × '+esc(e[2])+' '+(e[3]==="sec"?"sek.":"kart.")+'</div>'+d.sets.map((s,j)=>'<div class="set '+(s.done?"done":"")+'"><input type="checkbox" aria-label="Atlikta serija '+(j+1)+'" '+(s.done?"checked":"")+' onchange="changeDone('+i+','+j+',this.checked)"><label>Serija '+(j+1)+'</label><input type="number" min="0" step="any" placeholder="'+(e[3]==="sec"?"sek.":"kart.")+'" value="'+esc(s.value)+'" oninput="changeValue('+i+','+j+',this.value)"><span class="muted">'+(e[3]==="sec"?"s":"×")+'</span><button class="remove" title="Pašalinti seriją" aria-label="Pašalinti seriją '+(j+1)+'" onclick="removeSet('+i+','+j+')">×</button></div>').join("")+'<button class="add" onclick="addSet('+i+')">+ Pridėti seriją</button><textarea placeholder="Pastabos: technika, pojūčiai, svoris…" oninput="changeNote('+i+',this.value)">'+esc(d.notes)+'</textarea></section>'}).join("");progress()}
function progress(){let all=0,done=0;currentPlan()[day][1].forEach((_,i)=>get(i).sets.forEach(s=>{all++;if(s.done)done++}));let p=all?Math.round(done/all*100):0;el("bar").style.width=p+"%";el("pct").textContent=p+"%";el("summary").textContent=done+" iš "+all+" serijų atlikta"}
function pick(i){day=i;localStorage.setItem(KEY+"-day",day);render()}
function changeDone(i,j,v){get(i).sets[j].done=v;save();progress()}
function changeValue(i,j,v){get(i).sets[j].value=v;save()}
function changeNote(i,v){get(i).notes=v;save()}
function addSet(i){get(i).sets.push({done:false,value:""});save();render()}
function removeSet(i,j){const d=get(i);const set=d.sets[j];if(!set)return;if((set.done||set.value!=="")&&!confirm("Pašalinti šią seriją su jos įrašais?"))return;d.sets.splice(j,1);save();render()}
function clock(){el("clock").textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")}
function timerStop(){clearInterval(interval);interval=null}
function timerStart(s){timerStop();remaining=s;clock();interval=setInterval(()=>{remaining--;clock();if(remaining<=0){timerStop();alert("Poilsio laikas baigėsi!")}},1000)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,db},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mano-kalistenika-atsargine-kopija.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.db||typeof x.db!=="object")throw Error("Blogas failas");if(confirm("Atkurti kopiją? Dabartiniai įrašai bus pakeisti.")){db=x.db;save();render()}}catch(err){alert("Nepavyko atkurti kopijos: "+err.message)}};r.readAsText(f);e.target.value=""}
init();
</script></body></html>
